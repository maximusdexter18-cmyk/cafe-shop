<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Generator — Amber & Ash</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- QR code library (no build step, plain browser global) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{ --espresso:#211611; --espresso-2:#2c1d16; --cream:#f2e8d8; --cream-dim:#cdbfa8; --brass:#c99a44; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--espresso); color:var(--cream); font-family:'Inter',sans-serif; min-height:100vh;}
  .wrap{max-width:820px; margin:0 auto; padding:48px 6vw 80px;}

  h1{font-family:'Fraunces',serif; font-size:1.8rem; margin-bottom:6px;}
  p.lede{color:var(--cream-dim); line-height:1.6; margin-bottom:28px;}

  .controls{background:var(--espresso-2); border:1px solid rgba(201,154,68,0.25); border-radius:6px; padding:22px; margin-bottom:32px;}
  .row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
  label{display:block; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--cream-dim); margin-bottom:6px;}
  input{background:var(--espresso); border:1px solid rgba(205,191,168,0.3); color:var(--cream); padding:11px 12px; border-radius:3px; font-family:inherit; font-size:0.95rem; min-width:240px;}
  .btn{background:var(--brass); color:var(--espresso); border:none; padding:12px 22px; border-radius:2px; font-weight:600; cursor:pointer; font-size:0.9rem; text-transform:uppercase; letter-spacing:0.04em;}
  .btn.outline{background:transparent; color:var(--cream); border:1px solid var(--cream-dim);}
  .btn:hover{filter:brightness(1.08);}
  .hint{font-size:0.82rem; color:var(--cream-dim); margin-top:10px;}

  .print-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:22px;}
  .qr-card{background:#fff; color:#111; border-radius:8px; padding:18px; text-align:center;}
  .qr-card .table-no{font-family:'Fraunces',serif; font-size:1.3rem; font-weight:700; margin-bottom:4px;}
  .qr-card .url{font-size:0.72rem; color:#555; word-break:break-all; margin:10px 0; }
  .qr-card .qr-canvas-wrap{display:flex; justify-content:center;}
  .qr-card .qr-canvas-wrap canvas{display:block; width:170px; height:170px;}
  .qr-card a.dl{display:inline-block; margin-top:10px; font-size:0.78rem; color:#9c3f2b; text-decoration:none; font-weight:600;}

  @media print{
    body{background:#fff;}
    .controls, h1, p.lede{display:none;}
    .qr-card{box-shadow:none; border:1px solid #ccc; page-break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Table QR codes</h1>
  <p class="lede">Generate one scannable code per table. Each encodes <code>https://<your-domain>/order.html?table=N</code> — print, cut out, and place on the matching table.</p>

  <div class="controls">
    <div class="row">
      <div>
        <label for="domain">Deployed site domain</label>
        <input id="domain" type="text" placeholder="amberandash.vercel.app" value="">
      </div>
      <div>
        <label for="count">Number of tables</label>
        <input id="count" type="number" min="1" max="99" value="5" style="min-width:90px;">
      </div>
    </div>
    <div class="row">
      <button class="btn" id="genBtn">Generate QR codes</button>
      <button class="btn outline" id="printBtn">Print all</button>
    </div>
    <div class="hint">Tip: deploy first, then paste the exact domain (no <code>https://</code>, no trailing slash) so the codes point at the live site.</div>
  </div>

  <div class="print-grid" id="grid"></div>
</div>

<script>
const grid = document.getElementById('grid');
const domainInput = document.getElementById('domain');
const countInput = document.getElementById('count');

function buildUrl(domain, n) {
  const d = domain.trim().replace(/^https?:\/\//, '').replace(/\/+$/, '');
  return `https://${d}/order.html?table=${n}`;
}

document.getElementById('genBtn').addEventListener('click', () => {
  const domain = domainInput.value;
  const count = parseInt(countInput.value, 10) || 1;
  if (!domain) { alert('Enter your deployed domain first (e.g. amberandash.vercel.app).'); return; }

  grid.innerHTML = '';
  for (let n = 1; n <= count; n++) {
    const url = buildUrl(domain, n);
    const card = document.createElement('div');
    card.className = 'qr-card';
    card.innerHTML = `<div class="table-no">Table ${n}</div><div class="url">${url}</div>`;

    // QRCode.js needs a plain container element — it builds its OWN canvas
    // inside this div. Handing it a <canvas> directly (the old bug) causes it
    // to insert its result as a child of the canvas, which never renders,
    // even though the library still successfully generates the image data.
    const qrContainer = document.createElement('div');
    qrContainer.className = 'qr-canvas-wrap';
    card.appendChild(qrContainer);
    grid.appendChild(card);

    new QRCode(qrContainer, { text: url, width: 170, height: 170, correctLevel: QRCode.CorrectLevel.M });

    // Grab the actual canvas QRCode.js created inside our container for the download link.
    const realCanvas = qrContainer.querySelector('canvas');
    const link = document.createElement('a');
    link.className = 'dl';
    link.textContent = 'Download PNG';
    link.download = `amber-ash-table-${n}.png`;
    link.href = realCanvas ? realCanvas.toDataURL('image/png') : '#';
    card.appendChild(link);
  }
});

document.getElementById('printBtn').addEventListener('click', () => {
  if (!grid.children.length) { alert('Generate the codes first.'); return; }
  window.print();
});
</script>
</body>
</html>
